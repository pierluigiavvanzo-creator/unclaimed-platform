[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unclaimed-platform"
version = "0.1.0"
description = "Unclaimed Life Insurance Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1,<2",
  "psycopg[binary]>=3,<4",
  "httpx",
  "structlog",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "jsonschema>=4,<5",
  "PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unclaimed_platform"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["unclaimed_platform.core", "unclaimed_platform.api"]
