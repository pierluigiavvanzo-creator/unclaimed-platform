services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unclaimed
      POSTGRES_USER: unclaimed
      POSTGRES_PASSWORD: unclaimed
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unclaimed -d unclaimed"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - unclaimed_pgdata:/var/lib/postgresql/data

volumes:
  unclaimed_pgdata:
