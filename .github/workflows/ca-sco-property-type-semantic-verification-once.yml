name: ca-sco-property-type-semantic-verification-once

on:
  push:
    branches:
      - m3-ca-sco-v1-2-real-source-execution-once-adopted-baseline
    paths:
      - .github/workflows/ca-sco-property-type-semantic-verification-once.yml
      - .github/ca-sco-property-type-semantic-verification-once.trigger.json

permissions:
  contents: read

concurrency:
  group: ca-sco-property-type-semantic-verification-once-v1-2-adopted-baseline
  cancel-in-progress: false

jobs:
  bounded-semantic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate authorization branch runtime and trigger without source access
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          branch = 'm3-ca-sco-v1-2-real-source-execution-once-adopted-baseline'
          authorized_base = '7e4ebb91cd8d25be4f4b45ee08ec6bd3a5be5a36'
          reviewed_checkpoint = 'c18cddfc92bf3bb69f40b76170e687136e7fd21a'
          execution_ref = (
              'OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_'
              'REAL_SOURCE_EXECUTION_BOUNDED_C18CDDFC'
          )
          privacy_ref = (
              'OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_'
              'TRANSIENT_ROW_PRIVACY_BOUNDED_C18CDDFC'
          )
          workflow_path = (
              '.github/workflows/'
              'ca-sco-property-type-semantic-verification-once.yml'
          )
          trigger_path = Path(
              '.github/ca-sco-property-type-semantic-verification-once.trigger.json'
          )

          assert os.environ['GITHUB_REF_NAME'] == branch
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'retry is not authorized'
          subprocess.run(
              ['git', 'merge-base', '--is-ancestor', authorized_base, 'HEAD'],
              check=True,
          )
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{authorized_base}..HEAD'],
                  text=True,
              ).splitlines()
          )
          assert changed <= {workflow_path, str(trigger_path)}, changed

          auth_text = Path(
              'docs/audits/'
              'M3_CA_SCO_PROPERTY_TYPE_V1_2_REAL_SOURCE_EXECUTION_'
              'ADOPTED_BASELINE_AUTHORIZATION.md'
          ).read_text(encoding='utf-8')
          for expected in (
              execution_ref,
              privacy_ref,
              'GRANTED_NOT_CONSUMED',
              reviewed_checkpoint,
              'runtime contract: `1.2.0`',
          ):
              assert expected in auth_text

          proposal = json.loads(
              Path(
                  'sources/proposals/'
                  'ca_sco_segment_500_plus.'
                  'property_type_nonconforming_row_handling_policy_v1_2_'
                  'real_source_execution.v1_1.json'
              ).read_text(encoding='utf-8')
          )
          assert proposal['proposal_version'] == '1.1.0'
          assert proposal['adopted_transport_baseline']['expected_length'] == 162560390
          assert proposal['adopted_transport_baseline']['expected_etag'] == (
              '"222dd79f04c2a0a8fff166b01c8da746"'
          )
          assert proposal['transport_caps']['http_requests_max_total'] == 5
          assert proposal['transport_caps']['automatic_widening_allowed'] is False
          assert proposal['transport_caps']['automatic_retry_allowed'] is False
          assert proposal['row_processing_controls']['property_type_code_shape_regex'] == (
              r'^(?:[A-Z]{2}[0-9]{2}|ZZZZ)$'
          )
          assert proposal['v1_2_outcome_contract'][
              'source_continuation_after_property_type_format_unexpected'
          ] is False

          schema = json.loads(
              Path(
                  'schemas/common/property_type_semantic_verification_execution.v1_2.schema.json'
              ).read_text(encoding='utf-8')
          )
          assert schema['$id'].endswith(':1.2.0')

          runner_path = Path('scripts/ca_sco_property_type_semantic_verification.py')
          spec = importlib.util.spec_from_file_location('v12_runner_preflight', runner_path)
          assert spec is not None and spec.loader is not None
          runner = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = runner
          spec.loader.exec_module(runner)
          assert runner.EXPECTED_LENGTH == 162560390
          assert runner.EXPECTED_ETAG == '"222dd79f04c2a0a8fff166b01c8da746"'
          assert [m.local_header_offset for m in runner.CANONICAL_MEMBERS] == [
              0, 59745428, 96861315, 134172553
          ]
          assert runner.PROPERTY_TYPE_RE.pattern == r'^(?:[A-Z]{2}[0-9]{2}|ZZZZ)$'
          assert runner.MAX_ROWS_PER_MEMBER == 4
          assert runner.MAX_ROWS_TOTAL == 16
          assert runner.MAX_HEAD_REQUESTS == 1
          assert runner.MAX_RANGE_REQUESTS == 4
          assert runner.MAX_HTTP_REQUESTS == 5
          assert runner.RANGE_RESPONSE_BYTES == 131072
          assert runner.MAX_TOTAL_RESPONSE_BYTES == 524288
          assert runner.MAX_UNCOMPRESSED_BYTES_PER_MEMBER == 262144
          assert runner.MAX_UNCOMPRESSED_BYTES_TOTAL == 1048576
          assert runner.MAX_LOGICAL_RECORD_BYTES == 32768

          if trigger_path.exists():
              marker = json.loads(trigger_path.read_text(encoding='utf-8'))
              assert marker == {
                  'authorization_checkpoint_sha': authorized_base,
                  'execution_approval_ref': execution_ref,
                  'privacy_approval_ref': privacy_ref,
                  'reviewed_checkpoint_sha': reviewed_checkpoint,
                  'proposal_version': '1.1.0',
                  'runtime_contract': '1.2.0',
                  'single_use': True,
              }
              print('AUTHORIZED_V1_2_ADOPTED_BASELINE_EXECUTION_TRIGGER_VALIDATED')
          else:
              print('PREFLIGHT_ONLY_NO_SOURCE_ACCESS')
          PY

      - name: Determine one-shot execution gate
        id: gate
        run: |
          set -euo pipefail
          if [ -f .github/ca-sco-property-type-semantic-verification-once.trigger.json ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute authorized bounded v1.2 real-source verification once
        if: steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          umask 077
          python scripts/ca_sco_property_type_semantic_verification.py \
            --approval-ref OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_REAL_SOURCE_EXECUTION_BOUNDED_C18CDDFC \
            --privacy-approval-ref OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_TRANSIENT_ROW_PRIVACY_BOUNDED_C18CDDFC \
            --output .artifacts/ca_sco_segment_500_plus.property_type_semantic.execution.v1_2.real_source_once.json \
            --live-network > /dev/null

      - name: Validate derived v1.2 evidence and hard caps
        if: steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          execution_ref = (
              'OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_'
              'REAL_SOURCE_EXECUTION_BOUNDED_C18CDDFC'
          )
          privacy_ref = (
              'OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_'
              'TRANSIENT_ROW_PRIVACY_BOUNDED_C18CDDFC'
          )
          evidence_path = Path(
              '.artifacts/'
              'ca_sco_segment_500_plus.property_type_semantic.execution.'
              'v1_2.real_source_once.json'
          )
          schema_path = Path(
              'schemas/common/property_type_semantic_verification_execution.v1_2.schema.json'
          )
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(evidence)

          assert evidence['schema_version'] == '1.2.0'
          assert evidence['execution_approval_ref'] == execution_ref
          assert evidence['privacy_approval_ref'] == privacy_ref
          requests = evidence['requests_summary']
          assert requests['head_requests'] <= 1
          assert requests['range_requests'] <= 4
          assert requests['http_requests_total'] <= 5
          assert requests['total_body_bytes_read'] <= 524288
          sample = evidence['sample_summary']
          assert sample['sample_rows_examined'] <= 16
          assert all(value <= 4 for value in sample['rows_examined_per_member'].values())
          for key, value in evidence['safety_state'].items():
              assert value is False, f'safety flag must remain false: {key}'
          if evidence['stop_reason'] == 'PROPERTY_TYPE_FORMAT_UNEXPECTED':
              assert evidence['semantic_result_status'] == 'STOPPED_FAIL_CLOSED'
              assert evidence['control_disposition'] == {
                  'status_code': 'PROPERTY_TYPE_NONCONFORMING_STOPPED',
                  'reason_code': 'PROPERTY_TYPE_STRUCTURAL_NONCONFORMANCE',
              }
          else:
              assert evidence['control_disposition'] is None
          print('AUTHORIZED_BOUNDED_V1_2_ADOPTED_BASELINE_EVIDENCE_VALIDATED')
          PY

      - name: Upload derived evidence only
        if: steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ca-sco-property-type-v1-2-real-source-execution-2026-09-17
          path: .artifacts/ca_sco_segment_500_plus.property_type_semantic.execution.v1_2.real_source_once.json
          if-no-files-found: error
          retention-days: 7
