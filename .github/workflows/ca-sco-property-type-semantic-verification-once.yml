name: ca-sco-property-type-semantic-verification-once

on:
  push:
    branches:
      - m3-ca-sco-v1-2-real-source-execution-once-2026-09-17
    paths:
      - .github/workflows/ca-sco-property-type-semantic-verification-once.yml
      - .github/ca-sco-property-type-semantic-verification-once.trigger.json

permissions:
  contents: read

concurrency:
  group: ca-sco-property-type-semantic-verification-once-2026-09-17
  cancel-in-progress: false

jobs:
  bounded-semantic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate authorization and frozen execution boundary before source access
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          branch = 'm3-ca-sco-v1-2-real-source-execution-once-2026-09-17'
          authorized_base = '903c665af2641c56c85f1f57749ce6bd02e1b800'
          reviewed_proposal_sha = 'ed6a22a3ed5c727b3b4dd7f14416bb06acab2903'
          execution_ref = (
              'OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_'
              'REAL_SOURCE_EXECUTION_BOUNDED_ED6A22A3'
          )
          privacy_ref = (
              'OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_'
              'TRANSIENT_ROW_PRIVACY_BOUNDED_ED6A22A3'
          )
          workflow_path = '.github/workflows/ca-sco-property-type-semantic-verification-once.yml'
          trigger_path = Path('.github/ca-sco-property-type-semantic-verification-once.trigger.json')

          assert os.environ['GITHUB_REF_NAME'] == branch
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'retry is not authorized'
          subprocess.run(['git', 'merge-base', '--is-ancestor', authorized_base, 'HEAD'], check=True)
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{authorized_base}..HEAD'],
                  text=True,
              ).splitlines()
          )
          assert changed == {workflow_path, str(trigger_path)}, changed

          auth_text = Path(
              'docs/audits/M3_CA_SCO_PROPERTY_TYPE_V1_2_REAL_SOURCE_EXECUTION_AUTHORIZATION_2026_09_17.md'
          ).read_text(encoding='utf-8')
          for expected in (
              execution_ref,
              privacy_ref,
              'GRANTED_NOT_CONSUMED',
              reviewed_proposal_sha,
              'proposal version `1.1.0`',
              'runtime contract `1.2.0`',
          ):
              assert expected in auth_text

          proposal = json.loads(
              Path(
                  'sources/proposals/ca_sco_segment_500_plus.'
                  'property_type_nonconforming_row_handling_policy_v1_2_'
                  'real_source_execution.v1_1.json'
              ).read_text(encoding='utf-8')
          )
          assert proposal['proposal_version'] == '1.1.0'
          assert proposal['proposal_status'] == 'PROPOSAL_ONLY_NOT_AUTHORIZED'
          assert proposal['adopted_transport_baseline']['expected_length'] == 162560390
          assert proposal['adopted_transport_baseline']['expected_etag'] == '"222dd79f04c2a0a8fff166b01c8da746"'
          assert [
              item['local_header_offset']
              for item in proposal['adopted_transport_baseline']['canonical_members']
          ] == [0, 59745428, 96861315, 134172553]
          caps = proposal['transport_caps']
          assert caps['head_requests_max'] == 1
          assert caps['range_requests_max'] == 4
          assert caps['http_requests_max_total'] == 5
          assert caps['range_response_bytes_max_each'] == 131072
          assert caps['source_response_body_bytes_max_total'] == 524288
          assert caps['automatic_widening_allowed'] is False
          assert caps['automatic_retry_allowed'] is False
          assert proposal['row_processing_controls']['property_type_code_shape_regex'] == r'^(?:[A-Z]{2}[0-9]{2}|ZZZZ)$'
          assert proposal['row_processing_controls']['normalization_allowed'] is False
          assert proposal['v1_2_outcome_contract']['source_continuation_after_property_type_format_unexpected'] is False
          privacy = proposal['privacy_controls']
          assert privacy['memory_only'] is True
          assert privacy['transient_buffer_retention_days'] == 0
          assert privacy['raw_body_persistence'] is False
          assert privacy['full_row_persistence'] is False
          assert privacy['property_id_persistence'] is False
          assert privacy['owner_holder_persistence'] is False
          assert privacy['per_row_property_type_persistence'] is False
          assert privacy['row_specific_human_inspection'] is False

          schema = json.loads(
              Path('schemas/common/property_type_semantic_verification_execution.v1_2.schema.json').read_text(encoding='utf-8')
          )
          assert schema['$id'].endswith(':1.2.0')

          runner_path = Path('scripts/ca_sco_property_type_semantic_verification.py')
          spec = importlib.util.spec_from_file_location('v12_runner_preflight_20260917', runner_path)
          assert spec is not None and spec.loader is not None
          runner = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = runner
          spec.loader.exec_module(runner)
          assert runner.EXPECTED_LENGTH == 162560390
          assert runner.EXPECTED_ETAG == '"222dd79f04c2a0a8fff166b01c8da746"'
          assert [member.local_header_offset for member in runner.CANONICAL_MEMBERS] == [0, 59745428, 96861315, 134172553]
          assert runner.PROPERTY_TYPE_RE.pattern == r'^(?:[A-Z]{2}[0-9]{2}|ZZZZ)$'
          assert runner.MAX_ROWS_PER_MEMBER == 4
          assert runner.MAX_ROWS_TOTAL == 16
          assert runner.MAX_HEAD_REQUESTS == 1
          assert runner.MAX_RANGE_REQUESTS == 4
          assert runner.MAX_HTTP_REQUESTS == 5
          assert runner.RANGE_RESPONSE_BYTES == 131072
          assert runner.MAX_TOTAL_RESPONSE_BYTES == 524288
          assert runner.MAX_UNCOMPRESSED_BYTES_PER_MEMBER == 262144
          assert runner.MAX_UNCOMPRESSED_BYTES_TOTAL == 1048576
          assert runner.MAX_LOGICAL_RECORD_BYTES == 32768

          marker = json.loads(trigger_path.read_text(encoding='utf-8'))
          assert marker == {
              'authorization_checkpoint_sha': authorized_base,
              'execution_approval_ref': execution_ref,
              'privacy_approval_ref': privacy_ref,
              'reviewed_proposal_sha': reviewed_proposal_sha,
              'proposal_version': '1.1.0',
              'runtime_contract': '1.2.0',
              'single_use': True,
          }
          print('AUTHORIZED_V1_2_EXECUTION_TRIGGER_VALIDATED')
          PY

      - name: Execute authorized bounded v1.2 real-source verification once
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          umask 077
          python scripts/ca_sco_property_type_semantic_verification.py \
            --approval-ref OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_REAL_SOURCE_EXECUTION_BOUNDED_ED6A22A3 \
            --privacy-approval-ref OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_TRANSIENT_ROW_PRIVACY_BOUNDED_ED6A22A3 \
            --output .artifacts/ca_sco_segment_500_plus.property_type_semantic.execution.v1_2.real_source_once_2026_09_17.json \
            --live-network > /dev/null

      - name: Validate derived evidence and hard caps
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          execution_ref = 'OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_REAL_SOURCE_EXECUTION_BOUNDED_ED6A22A3'
          privacy_ref = 'OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_V1_2_TRANSIENT_ROW_PRIVACY_BOUNDED_ED6A22A3'
          evidence_path = Path('.artifacts/ca_sco_segment_500_plus.property_type_semantic.execution.v1_2.real_source_once_2026_09_17.json')
          schema_path = Path('schemas/common/property_type_semantic_verification_execution.v1_2.schema.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(evidence)

          assert evidence['schema_version'] == '1.2.0'
          assert evidence['execution_approval_ref'] == execution_ref
          assert evidence['privacy_approval_ref'] == privacy_ref
          requests = evidence['requests_summary']
          assert requests['head_requests'] <= 1
          assert requests['range_requests'] <= 4
          assert requests['http_requests_total'] <= 5
          assert requests['total_body_bytes_read'] <= 524288
          sample = evidence['sample_summary']
          assert sample['sample_rows_examined'] <= 16
          assert all(value <= 4 for value in sample['rows_examined_per_member'].values())
          for key, value in evidence['safety_state'].items():
              assert value is False, f'safety flag must remain false: {key}'
          if evidence['stop_reason'] == 'PROPERTY_TYPE_FORMAT_UNEXPECTED':
              assert evidence['semantic_result_status'] == 'STOPPED_FAIL_CLOSED'
              assert evidence['control_disposition'] == {
                  'status_code': 'PROPERTY_TYPE_NONCONFORMING_STOPPED',
                  'reason_code': 'PROPERTY_TYPE_STRUCTURAL_NONCONFORMANCE',
              }
          else:
              assert evidence['control_disposition'] is None
          print('AUTHORIZED_BOUNDED_V1_2_EVIDENCE_VALIDATED')
          PY

      - name: Upload derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ca-sco-property-type-v1-2-real-source-execution-2026-09-17
          path: .artifacts/ca_sco_segment_500_plus.property_type_semantic.execution.v1_2.real_source_once_2026_09_17.json
          if-no-files-found: error
          retention-days: 7
