name: ca-sco-transport-archive-layout-revalidation-once

on:
  push:
    branches:
      - m3-ca-sco-transport-archive-layout-revalidation-once
    paths:
      - .github/workflows/ca-sco-transport-archive-layout-revalidation-once.yml
      - .github/ca-sco-transport-archive-layout-revalidation-once.trigger.json
      - scripts/ca_sco_transport_archive_layout_revalidation.py
      - schemas/common/property_type_transport_archive_layout_revalidation_execution.v1.schema.json
      - tests/unit/test_ca_sco_transport_archive_layout_revalidation.py
      - tests/contract/test_ca_sco_transport_archive_layout_revalidation_execution_stage.py

permissions:
  contents: read

concurrency:
  group: ca-sco-transport-archive-layout-revalidation-once
  cancel-in-progress: false

jobs:
  bounded-structural-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate implementation and authorization without source access
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          branch = "m3-ca-sco-transport-archive-layout-revalidation-once"
          authorization_checkpoint = "4079fb44b36699e9b05821761c222d063a89648d"
          accepted_review_sha = "b8f703db18207661cd799b0baf1f0dac1bfdc398"
          reviewed_proposal_sha = "359b1c1a86d34edabcd028e5e5fbb6fc3acba781"
          execution_ref = (
              "OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_STRUCTURAL_"
              "REVALIDATION_EXECUTION_BOUNDED_B8F703DB"
          )
          privacy_ref = (
              "OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_STRUCTURAL_BYTE_"
              "PRIVACY_BOUNDED_B8F703DB"
          )
          trigger_path = Path(
              ".github/ca-sco-transport-archive-layout-revalidation-once.trigger.json"
          )
          allowed_changed = {
              ".github/workflows/ca-sco-transport-archive-layout-revalidation-once.yml",
              ".github/ca-sco-transport-archive-layout-revalidation-once.trigger.json",
              "scripts/ca_sco_transport_archive_layout_revalidation.py",
              "schemas/common/property_type_transport_archive_layout_revalidation_execution.v1.schema.json",
              "tests/unit/test_ca_sco_transport_archive_layout_revalidation.py",
              "tests/contract/test_ca_sco_transport_archive_layout_revalidation_execution_stage.py",
              "docs/audits/M3_CA_SCO_PROPERTY_TYPE_TRANSPORT_ARCHIVE_REVALIDATION_IMPLEMENTATION_REUSE.md",
          }

          assert os.environ["GITHUB_REF_NAME"] == branch
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1", (
              "automatic/manual retry is not authorized"
          )
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", authorization_checkpoint, "HEAD"],
              check=True,
          )
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{authorization_checkpoint}..HEAD"],
                  text=True,
              ).splitlines()
          )
          assert changed <= allowed_changed, changed

          auth = json.loads(
              Path(
                  "sources/evidence/"
                  "ca_sco_segment_500_plus."
                  "property_type_transport_archive_layout_revalidation_approval.v1.json"
              ).read_text(encoding="utf-8")
          )
          assert auth["authorization_status"] == "GRANTED_NOT_CONSUMED"
          assert auth["execution_approval_ref"] == execution_ref
          assert auth["structural_byte_privacy_approval_ref"] == privacy_ref
          assert auth["single_use"] is True
          assert auth["reusable"] is False
          assert auth["accepted_review"]["head_sha"] == accepted_review_sha
          assert auth["reviewed_proposal"]["head_sha"] == reviewed_proposal_sha
          assert auth["execution_caps"] == {
              "head_requests_max": 1,
              "range_requests_max": 4,
              "http_requests_max_total": 5,
              "range_response_bytes_max_each": 131072,
              "source_response_body_bytes_max_total": 524288,
              "full_body_fallback_allowed": False,
              "automatic_widening_allowed": False,
              "automatic_retry_allowed": False,
          }
          constraints = auth["structural_constraints"]
          assert constraints["classic_zip_eocd_required"] is True
          assert constraints["zip64_supported"] is False
          assert constraints["multi_disk_supported"] is False
          assert constraints["central_directory_metadata_only"] is True
          assert constraints["decompression_allowed"] is False
          assert constraints["csv_parsing_allowed"] is False
          assert constraints["row_or_field_inspection_allowed"] is False

          runner_path = Path("scripts/ca_sco_transport_archive_layout_revalidation.py")
          spec = importlib.util.spec_from_file_location(
              "structural_revalidation_preflight", runner_path
          )
          assert spec is not None and spec.loader is not None
          runner = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = runner
          spec.loader.exec_module(runner)
          assert runner.ENDPOINT == auth["endpoint_binding"]["endpoint"]
          assert runner.HOST == auth["endpoint_binding"]["exact_host"]
          assert runner.MAX_HEAD_REQUESTS == 1
          assert runner.MAX_RANGE_REQUESTS == 4
          assert runner.MAX_HTTP_REQUESTS == 5
          assert runner.MAX_RANGE_RESPONSE_BYTES == 131072
          assert runner.MAX_TOTAL_SOURCE_BODY_BYTES == 524288
          assert runner.EXECUTION_APPROVAL_REF == execution_ref
          assert runner.STRUCTURAL_BYTE_PRIVACY_APPROVAL_REF == privacy_ref

          if trigger_path.exists():
              marker = json.loads(trigger_path.read_text(encoding="utf-8"))
              assert marker == {
                  "authorization_checkpoint_sha": authorization_checkpoint,
                  "implementation_checkpoint_sha": marker["implementation_checkpoint_sha"],
                  "execution_approval_ref": execution_ref,
                  "structural_byte_privacy_approval_ref": privacy_ref,
                  "accepted_review_sha": accepted_review_sha,
                  "reviewed_proposal_sha": reviewed_proposal_sha,
                  "single_use": True,
              }
              implementation_checkpoint = marker["implementation_checkpoint_sha"]
              assert len(implementation_checkpoint) == 40
              parent = subprocess.check_output(
                  ["git", "rev-parse", "HEAD^"],
                  text=True,
              ).strip()
              assert parent == implementation_checkpoint
              print("AUTHORIZED_STRUCTURAL_REVALIDATION_TRIGGER_VALIDATED")
          else:
              print("PREFLIGHT_ONLY_NO_SOURCE_ACCESS")
          PY

      - name: Run repository-only structural verifier tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/unit/test_ca_sco_transport_archive_layout_revalidation.py \
            tests/contract/test_ca_sco_transport_archive_layout_revalidation_execution_stage.py

      - name: Determine one-shot execution gate
        id: gate
        run: |
          set -euo pipefail
          if [ -f .github/ca-sco-transport-archive-layout-revalidation-once.trigger.json ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute authorized structural revalidation once
        if: steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          umask 077
          python scripts/ca_sco_transport_archive_layout_revalidation.py \
            --approval-ref OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_STRUCTURAL_REVALIDATION_EXECUTION_BOUNDED_B8F703DB \
            --structural-byte-privacy-approval-ref OWNER_APPROVAL_2026-09-17_CA_SCO_PROPERTY_TYPE_STRUCTURAL_BYTE_PRIVACY_BOUNDED_B8F703DB \
            --output .artifacts/ca_sco_segment_500_plus.property_type_transport_archive_layout_revalidation.execution.v1.json \
            --live-network > /dev/null

      - name: Validate derived candidate evidence and privacy boundary
        if: steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator, FormatChecker

          evidence_path = Path(
              ".artifacts/"
              "ca_sco_segment_500_plus."
              "property_type_transport_archive_layout_revalidation.execution.v1.json"
          )
          schema_path = Path(
              "schemas/common/"
              "property_type_transport_archive_layout_revalidation_execution.v1.schema.json"
          )
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(
              schema,
              format_checker=FormatChecker(),
          ).validate(evidence)

          allowed = {
              "OBSERVED_CONTENT_LENGTH",
              "OBSERVED_ETAG",
              "OBSERVED_CONTENT_TYPE",
              "OBSERVED_ACCEPT_RANGES",
              "OBSERVED_LAST_MODIFIED",
              "OBSERVED_AT",
              "CANONICAL_MEMBER_NAMES",
              "CANONICAL_MEMBER_LOCAL_HEADER_OFFSETS",
              "CANONICAL_MEMBER_MATCH_STATUS",
              "ADDITIONAL_MEMBER_COUNT",
              "REVALIDATION_RESULT_STATUS",
              "STOP_REASON",
          }
          assert set(evidence) == allowed
          if evidence["REVALIDATION_RESULT_STATUS"] == "CANDIDATE_BASELINE_ESTABLISHED":
              length = evidence["OBSERVED_CONTENT_LENGTH"]
              assert isinstance(length, int) and length > 0
              offsets = evidence["CANONICAL_MEMBER_LOCAL_HEADER_OFFSETS"]
              assert all(isinstance(value, int) and 0 <= value < length for value in offsets.values())
              assert evidence["CANONICAL_MEMBER_MATCH_STATUS"] == "ALL_CANONICAL_MEMBERS_UNIQUE"
              assert evidence["STOP_REASON"] is None
          else:
              assert evidence["REVALIDATION_RESULT_STATUS"] == "STOPPED_FAIL_CLOSED"
              assert evidence["CANONICAL_MEMBER_MATCH_STATUS"] == "NOT_ESTABLISHED"
              assert evidence["STOP_REASON"] is not None
          print("AUTHORIZED_STRUCTURAL_REVALIDATION_EVIDENCE_VALIDATED")
          PY

      - name: Upload derived candidate evidence only
        if: steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ca-sco-transport-archive-layout-revalidation-2026-09-17
          path: .artifacts/ca_sco_segment_500_plus.property_type_transport_archive_layout_revalidation.execution.v1.json
          if-no-files-found: error
          retention-days: 7
