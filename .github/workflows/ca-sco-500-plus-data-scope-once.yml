name: ca-sco-500-plus-data-scope-once

on:
  push:
    branches:
      - m3-ca-sco-500-plus-range-inspection
    paths:
      - .github/workflows/ca-sco-500-plus-data-scope-once.yml

permissions:
  contents: read

jobs:
  bounded-data-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Execute bounded $500+ range inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p range-inspection
          APPROVAL_REF='OWNER_CHAT_APPROVAL_2026-09-14T17:21+02:00_BOUNDED_DATA_SCOPE_INSPECTION'
          python scripts/ca_sco_500_plus_data_scope_inspection.py \
            --approval-ref "$APPROVAL_REF" \
            --timeout-seconds 10 \
            --output range-inspection/ca_sco_segment_500_plus.data_scope.execution.v1.json
      - name: Validate execution evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(
              Path("schemas/common/source_data_scope_inspection_execution.schema.json")
              .read_text(encoding="utf-8")
          )
          evidence_path = Path(
              "range-inspection/ca_sco_segment_500_plus.data_scope.execution.v1.json"
          )
          payload = json.loads(evidence_path.read_text(encoding="utf-8"))
          Draft202012Validator(
              schema,
              format_checker=FormatChecker(),
          ).validate(payload)
          assert payload["safety_state"]["full_archive_downloaded"] is False
          assert payload["safety_state"]["raw_body_persisted"] is False
          assert payload["safety_state"]["csv_data_rows_parsed"] == 0
          assert payload["safety_state"]["record_values_persisted"] is False
          assert payload["safety_state"]["beneficiary_matching_performed"] is False
          assert payload["safety_state"]["outreach_performed"] is False
          assert payload["total_response_body_bytes_read"] <= 14_811_136
          print(
              "VALIDATED_DATA_SCOPE_RESULT="
              + json.dumps(
                  {
                      "result_status": payload["result_status"],
                      "stop_reason": payload["stop_reason"],
                      "member_count": payload["archive"]["member_count"],
                      "csv_candidate_count": payload["archive"]["csv_candidate_count"],
                      "csv_header_candidates": payload["csv_header_candidates"],
                      "range_request_count": len(payload["range_requests"]),
                      "total_response_body_bytes_read": payload[
                          "total_response_body_bytes_read"
                      ],
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY
      - name: Upload derived structure evidence
        uses: actions/upload-artifact@v4
        with:
          name: ca-sco-500-plus-data-scope
          path: range-inspection/*.json
          retention-days: 1
