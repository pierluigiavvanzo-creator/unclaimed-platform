name: governance-copy

# AGENTS_MASTER.md is generated from the shared public governance repository.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout canonical governance source
        uses: actions/checkout@v4
        with:
          repository: pierluigiavvanzo-creator/governance-AGENTS_MASTER.md
          ref: main
          path: .governance-source

      - name: Validate generated body hash
        shell: bash
        run: |
          declared=$(head -n1 AGENTS_MASTER.md | sed -n 's/.*body-sha256:\([0-9a-f]\{64\}\).*/\1/p')
          actual=$(tail -n +2 AGENTS_MASTER.md | tr -d '\r' | sha256sum | cut -d' ' -f1)
          if [ -z "$declared" ]; then
            echo "::error::AGENTS_MASTER.md has no governance header"; exit 1
          fi
          if [ "$declared" != "$actual" ]; then
            echo "::error::AGENTS_MASTER.md body does not match its generated hash"; exit 1
          fi

      - name: Detect governance source drift
        shell: bash
        run: |
          tail -n +2 AGENTS_MASTER.md | tr -d '\r' > /tmp/project-agents-master.md
          tr -d '\r' < .governance-source/AGENTS_MASTER.md > /tmp/source-agents-master.md
          if ! cmp -s /tmp/project-agents-master.md /tmp/source-agents-master.md; then
            echo "::error::AGENTS_MASTER.md is out of sync with pierluigiavvanzo-creator/governance-AGENTS_MASTER.md@main"
            echo "::error::Update the governance source first, then run the approved governance sync."
            exit 1
          fi
          echo "AGENTS_MASTER.md matches the canonical governance source."
