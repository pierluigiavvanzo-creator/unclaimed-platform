name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src/unclaimed_platform/core src/unclaimed_platform/api src/unclaimed_platform/adapters/storage
      - run: python -m pytest -q tests/contract
      - run: python -m pytest -q tests/smoke
      - run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - name: Install reviewer console dependencies
        working-directory: apps/reviewer-console
        run: npm install --no-audit --no-fund
      - name: Frontend lint
        working-directory: apps/reviewer-console
        run: npm run lint
      - name: Frontend typecheck
        working-directory: apps/reviewer-console
        run: npm run typecheck
      - name: Frontend build
        working-directory: apps/reviewer-console
        run: npm run build

  vercel-backend-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Vercel FastAPI entrypoint smoke
        run: python -m pytest -q tests/smoke/test_vercel_backend_entrypoint.py
