name: ca-sco-mvp1-property-type-row-defer-live-once

on:
  push:
    branches:
      - mvp1-ca-property-type-row-defer-live-validation-once
    paths:
      - .github/ca-sco-mvp1-property-type-row-defer-live-once.trigger.json

permissions:
  contents: write

concurrency:
  group: ca-sco-mvp1-property-type-row-defer-live-once-b2af7877
  cancel-in-progress: false

jobs:
  bounded-d010-live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate exact authorization and trigger without source access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          branch = 'mvp1-ca-property-type-row-defer-live-validation-once'
          auth_checkpoint = '17ec4183726844593c02d442516aef92bf07916c'
          execution_ref = 'OWNER_APPROVAL_2026-09-17_CA_SCO_MVP1_PROPERTY_TYPE_ROW_DEFER_REAL_SOURCE_VALIDATION_BOUNDED_B2AF7877'
          privacy_ref = 'OWNER_APPROVAL_2026-09-17_CA_SCO_MVP1_PROPERTY_TYPE_ROW_DEFER_TRANSIENT_ROW_PRIVACY_BOUNDED_B2AF7877'
          workflow_path = '.github/workflows/ca-sco-mvp1-property-type-row-defer-live-once.yml'
          trigger_path = '.github/ca-sco-mvp1-property-type-row-defer-live-once.trigger.json'
          approval_path = Path('sources/evidence/ca_sco_mvp1_property_type_row_defer_live_validation_approval.v1.json')

          assert os.environ['GITHUB_REF_NAME'] == branch
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'retry/rerun is not authorized'
          subprocess.run(['git', 'merge-base', '--is-ancestor', auth_checkpoint, 'HEAD'], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{auth_checkpoint}..HEAD'], text=True).splitlines())
          assert changed <= {workflow_path, trigger_path}, changed

          approval = json.loads(approval_path.read_text(encoding='utf-8'))
          assert approval['authorization_gate'] == 'HUMAN_CA_SCO_MVP1_PROPERTY_TYPE_ROW_DEFER_REAL_SOURCE_VALIDATION_AUTHORIZATION'
          assert approval['authorization_base_head'] == 'a15346a95cc293a1db3cd849b852d5be8846538d'
          assert approval['authorization_base_ci_run'] == '35234190191'
          assert approval['authorization_base_ci_conclusion'] == 'SUCCESS'
          assert approval['execution_approval_ref'] == execution_ref
          assert approval['privacy_approval_ref'] == privacy_ref
          assert approval['approval_state'] == 'GRANTED_NOT_YET_CONSUMED'
          assert approval['single_use'] is True
          assert approval['reusable'] is False
          assert approval['retry_authorized'] is False

          expected_blobs = {
              'scripts/ca_sco_mvp1_property_type_validation.py': '8e952a80105d56a8e84e6fb9feb5524dd01625d0',
              'src/unclaimed_platform/adapters/sources/california_property_type.py': '05e8637e42070dd6f04218592d20d4a230ab948e',
              'policies/states/CA/ca_sco_property_type_classification.v1.json': '840d09d87187c53d26f4d562527dcb92d810a9f3',
              'scripts/ca_sco_property_type_semantic_verification.py': '706183d5425da16b25f8186574cc356135803326',
          }
          for path, expected in expected_blobs.items():
              observed = subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()
              assert observed == expected, (path, observed, expected)

          trigger = json.loads(Path(trigger_path).read_text(encoding='utf-8'))
          assert trigger == {
              'authorization_checkpoint_sha': auth_checkpoint,
              'execution_approval_ref': execution_ref,
              'privacy_approval_ref': privacy_ref,
              'policy_id': 'ROW_DEFER_CONTINUE_METADATA_ONLY',
              'single_use': True,
              'retry_authorized': False,
          }

          legacy_path = Path('scripts/ca_sco_property_type_semantic_verification.py')
          spec = importlib.util.spec_from_file_location('legacy_d010_preflight', legacy_path)
          assert spec is not None and spec.loader is not None
          legacy = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = legacy
          spec.loader.exec_module(legacy)
          assert legacy.EXPECTED_LENGTH == 162560390
          assert legacy.EXPECTED_ETAG == '"222dd79f04c2a0a8fff166b01c8da746"'
          assert [m.local_header_offset for m in legacy.CANONICAL_MEMBERS] == [0, 59745428, 96861315, 134172553]
          assert legacy.MAX_HEAD_REQUESTS == 1
          assert legacy.MAX_RANGE_REQUESTS == 4
          assert legacy.MAX_HTTP_REQUESTS == 5
          assert legacy.RANGE_RESPONSE_BYTES == 131072
          assert legacy.MAX_TOTAL_RESPONSE_BYTES == 524288
          assert legacy.MAX_ROWS_PER_MEMBER == 4
          assert legacy.MAX_ROWS_TOTAL == 16
          print('D010_LIVE_VALIDATION_AUTHORIZATION_PREFLIGHT_PASS')
          PY

      - name: Consume both approvals before network
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('sources/evidence/ca_sco_mvp1_property_type_row_defer_live_validation_approval.v1.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['approval_state'] == 'GRANTED_NOT_YET_CONSUMED'
          data['approval_state'] = 'CONSUMED_SINGLE_USE_NON_REUSABLE'
          data['consumed_at_utc'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          data['execution_run_id'] = os.environ['GITHUB_RUN_ID']
          data['execution_run_attempt'] = int(os.environ['GITHUB_RUN_ATTEMPT'])
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/evidence/ca_sco_mvp1_property_type_row_defer_live_validation_approval.v1.json
          git commit -m 'governance: consume D010 single-use live approvals'
          git push origin HEAD:mvp1-ca-property-type-row-defer-live-validation-once

      - name: Execute exactly one bounded D-010 live validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          umask 077
          python scripts/ca_sco_mvp1_property_type_validation.py \
            --approval-ref OWNER_APPROVAL_2026-09-17_CA_SCO_MVP1_PROPERTY_TYPE_ROW_DEFER_REAL_SOURCE_VALIDATION_BOUNDED_B2AF7877 \
            --privacy-approval-ref OWNER_APPROVAL_2026-09-17_CA_SCO_MVP1_PROPERTY_TYPE_ROW_DEFER_TRANSIENT_ROW_PRIVACY_BOUNDED_B2AF7877 \
            --output .artifacts/ca_sco_mvp1_property_type_row_defer.live_once.json \
            --live-network

      - name: Validate privacy-safe derived evidence and hard caps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('.artifacts/ca_sco_mvp1_property_type_row_defer.live_once.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          execution_ref = 'OWNER_APPROVAL_2026-09-17_CA_SCO_MVP1_PROPERTY_TYPE_ROW_DEFER_REAL_SOURCE_VALIDATION_BOUNDED_B2AF7877'
          privacy_ref = 'OWNER_APPROVAL_2026-09-17_CA_SCO_MVP1_PROPERTY_TYPE_ROW_DEFER_TRANSIENT_ROW_PRIVACY_BOUNDED_B2AF7877'

          assert data['schema_version'] == '1.0.0'
          assert data['execution_id'] == 'ca.sco.unclaimed_property.bulk.500_plus.mvp1.property_type.validation'
          assert data['policy_id'] == 'ROW_DEFER_CONTINUE_METADATA_ONLY'
          assert data['execution_approval_ref'] == execution_ref
          assert data['privacy_approval_ref'] == privacy_ref
          requests = data['requests_summary']
          assert requests['head_requests'] <= 1
          assert requests['range_requests'] <= 4
          assert requests['http_requests_total'] <= 5
          assert requests['total_body_bytes_read'] <= 524288
          sample = data['sample_summary']
          assert sample['sample_rows_examined'] <= 16
          assert all(v <= 4 for v in sample['rows_examined_per_member'].values())
          assert sample['nonconforming_rows_deferred_count'] >= 0
          assert sample['insurance_rows_count'] >= 0
          assert sample['mvp1_primary_rows_count'] >= 0
          assert set(sample['distinct_insurance_codes']) <= {'IN01','IN02','IN03','IN04','IN05','IN06','IN07','IN08','IN99'}
          assert sample['mvp1_primary_rows_count'] <= sample['insurance_rows_count'] <= sample['sample_rows_examined']
          for key, value in data['safety_state'].items():
              assert value is False, f'safety flag must remain false: {key}'
          assert data['semantic_result_status'] in {
              'MVP1_PRIMARY_IN03_OBSERVED',
              'INSURANCE_CODE_OBSERVED_NO_IN03',
              'NO_INSURANCE_CODE_OBSERVED_IN_BOUNDED_SAMPLE',
              'STOPPED_FAIL_CLOSED',
          }
          print('D010_LIVE_VALIDATION_EVIDENCE_PASS')
          print('D010_EVIDENCE_JSON=' + json.dumps(data, sort_keys=True, separators=(',', ':')))
          PY

      - name: Upload derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ca-sco-mvp1-property-type-row-defer-live-once-2026-09-17
          path: .artifacts/ca_sco_mvp1_property_type_row_defer.live_once.json
          if-no-files-found: error
          retention-days: 7
