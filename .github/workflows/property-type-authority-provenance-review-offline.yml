name: property-type-authority-provenance-review-offline

on:
  push:
    branches:
      - m3-ca-sco-property-type-authority-archive-provenance-review

permissions:
  contents: read

env:
  PDF_PATH: sources/authority/ca/sco/upd_naupa_ii_codes_dormancy_periods/7884f765e66d59526d530c0e90ee952a5ca7a70a99eaa060e5fc775f35a721e5.pdf
  EXPECTED_SHA256: 7884f765e66d59526d530c0e90ee952a5ca7a70a99eaa060e5fc775f35a721e5

jobs:
  offline-review-extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable archive
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$EXPECTED_SHA256" "$PDF_PATH" | sha256sum -c -
          test "$(stat -c%s "$PDF_PATH")" -eq 329585
      - name: Inspect PDF structure
        shell: bash
        run: |
          set -euo pipefail
          which pdfinfo
          pdfinfo "$PDF_PATH" | tee /tmp/authority-pdfinfo.txt
      - name: Extract layout-aware text
        shell: bash
        run: |
          set -euo pipefail
          which pdftotext
          pdftotext -layout "$PDF_PATH" /tmp/authority.txt
          test -s /tmp/authority.txt
      - name: Render all pages
        shell: bash
        run: |
          set -euo pipefail
          which pdftoppm
          mkdir -p /tmp/authority-pages
          pdftoppm -png -r 160 "$PDF_PATH" /tmp/authority-pages/page
          test "$(find /tmp/authority-pages -type f -name 'page-*.png' | wc -l)" -eq 4
      - name: Upload review-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: property-type-authority-provenance-review-offline
          path: |
            /tmp/authority.txt
            /tmp/authority-pdfinfo.txt
            /tmp/authority-pages/*.png
          if-no-files-found: error
          retention-days: 1
