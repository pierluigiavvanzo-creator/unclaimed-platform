name: property-type-authority-provenance-review-offline

on:
  push:
    branches:
      - m3-ca-sco-property-type-authority-archive-provenance-review

permissions:
  contents: read

env:
  PDF_PATH: sources/authority/ca/sco/upd_naupa_ii_codes_dormancy_periods/7884f765e66d59526d530c0e90ee952a5ca7a70a99eaa060e5fc775f35a721e5.pdf
  EXPECTED_SHA256: 7884f765e66d59526d530c0e90ee952a5ca7a70a99eaa060e5fc775f35a721e5

jobs:
  offline-review-extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable archive
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$EXPECTED_SHA256" "$PDF_PATH" | sha256sum -c -
          test "$(stat -c%s "$PDF_PATH")" -eq 329585
      - name: Install offline review PDF tooling
        run: python -m pip install --disable-pip-version-check PyMuPDF
      - name: Extract text, inspect structure and render all pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/authority-pages
          python - <<'PY'
          import os
          from pathlib import Path
          import fitz

          pdf_path = Path(os.environ['PDF_PATH'])
          doc = fitz.open(pdf_path)
          if doc.page_count != 4:
              raise SystemExit(f'unexpected page count: {doc.page_count}')

          info_lines = [
              f'pages: {doc.page_count}',
              f'is_pdf: {doc.is_pdf}',
              f'is_encrypted: {doc.is_encrypted}',
              f'needs_pass: {doc.needs_pass}',
          ]
          for key, value in sorted((doc.metadata or {}).items()):
              info_lines.append(f'metadata.{key}: {value or ""}')
          Path('/tmp/authority-pdfinfo.txt').write_text('\n'.join(info_lines) + '\n', encoding='utf-8')

          text_parts = []
          matrix = fitz.Matrix(160 / 72, 160 / 72)
          for index, page in enumerate(doc, start=1):
              text_parts.append(f'===== PAGE {index} =====\n')
              text_parts.append(page.get_text('text', sort=True))
              text_parts.append('\n')
              pix = page.get_pixmap(matrix=matrix, alpha=False)
              pix.save(f'/tmp/authority-pages/page-{index}.png')

          Path('/tmp/authority.txt').write_text(''.join(text_parts), encoding='utf-8')
          if not Path('/tmp/authority.txt').stat().st_size:
              raise SystemExit('empty text extraction')
          PY
          test "$(find /tmp/authority-pages -type f -name 'page-*.png' | wc -l)" -eq 4
      - name: Upload review-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: property-type-authority-provenance-review-offline
          path: |
            /tmp/authority.txt
            /tmp/authority-pdfinfo.txt
            /tmp/authority-pages/*.png
          if-no-files-found: error
          retention-days: 1
